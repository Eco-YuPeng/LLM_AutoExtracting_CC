  # NOTE: Table_S1_for_myself.xlsx's "CCs Species" column has 130 unique
  # values — this seed list covers only the ones independently verified
  # against Garba et al. (2022) plus one unambiguous addition. Extend as
  # real papers are processed; do not bulk-import the remaining common
  # names without verifying each scientific-name match against a real
  # source (e.g. GBIF/WFO lookup, see below).

external_apis:
  - name: GBIF species match
    purpose: Validate a scientific name resolves to a real, accepted taxon.
    base_url: https://api.gbif.org/v1/species/match
    notes: >
      Query param `name={scientific_name}`. Free, no API key. Confirm
      exact response field names against extract-from-pdfs skill's
      05_validate_with_apis.py before wiring.

  - name: World Flora Online (WFO)
    purpose: Cross-check plant taxonomy / accepted name status.
    notes: >
      Confirm current API endpoint against
      extract-from-pdfs skill's 05_validate_with_apis.py — endpoint
      details not independently re-verified in this pass.

  - name: Nominatim (OpenStreetMap) reverse geocoding
    purpose: Reverse-geocode extracted lat/lon and check the result's
      country against the country stated in the paper's text.
    base_url: https://nominatim.openstreetmap.org/reverse
    notes: >
      Query params `lat={lat}&lon={lon}&format=json`. Respect Nominatim's
      usage policy (rate limit, User-Agent header) if calling directly
      instead of through GeoNames.

  - name: GeoNames
    purpose: Alternative reverse geocoding / place-name lookup.
    notes: >
      Requires a free registered username. Confirm current API endpoint
      against extract-from-pdfs skill's 05_validate_with_apis.py.

  # IMPORTANT: none of the above domains are in this chat sandbox's
  # bash_tool network allowlist. Prototyping calls to these APIs from
  # inside this container must go through the chat's own web_fetch tool
  # (one at a time); real batch validation runs need an environment
  # with open network access (e.g. CyVerse).
