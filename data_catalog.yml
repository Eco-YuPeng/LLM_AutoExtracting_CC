# Data Catalog — cover crop species gazetteer + external validation APIs
#
# POLICY: species entries are used for deterministic (regex/gazetteer)
# matching in Task 4 of TASKS.md — never guess a species from partial
# text; if it's not in this list, extend the list (with a real source)
# rather than letting an LLM guess a scientific name.
#
# API entries are used in Task 11 (validate). Confirm exact
# request/response shape against the extract-from-pdfs skill's
# 05_validate_with_apis.py before wiring calls — this file records the
# service and purpose, not a guaranteed-exact endpoint contract.
#
# ── Sections ────────────────────────────────────────────────────────────
#   1. Cover crop species gazetteer — seed list, extend as new species
#      are encountered in real papers (each addition needs a real source)
#   2. External validation APIs
#
# ══════════════════════════════════════════════════════════════════════

