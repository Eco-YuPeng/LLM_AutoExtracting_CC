name: Weekly API Endpoint Health Check

on:
  schedule:
    # Every Monday at 8am UTC
    - cron: "0 8 * * 1"
  workflow_dispatch: # Allow manual runs from Actions tab

jobs:
  check-endpoints:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml requests

      - name: Check all external_apis endpoints
        id: health
        run: |
          python - <<'SCRIPT'
          import sys, requests, yaml

          CATALOG = "data_catalog.yml"
          TIMEOUT = 20

          with open(CATALOG) as f:
              catalog = yaml.safe_load(f)

          urls = [
              (entry["name"], entry["base_url"])
              for entry in catalog.get("external_apis", [])
              if entry.get("base_url")
          ]

          failures = []
          for name, url in urls:
              try:
                  r = requests.head(url, timeout=TIMEOUT, headers={"User-Agent": "Mozilla/5.0"},
                                     allow_redirects=True)
                  if r.status_code in (405, 501):
                      r = requests.get(url, timeout=TIMEOUT, headers={"User-Agent": "Mozilla/5.0"},
                                        allow_redirects=True, stream=True)
                  if r.status_code >= 400:
                      failures.append((name, url, f"HTTP {r.status_code}"))
                      print(f"FAIL {name}: {url} (HTTP {r.status_code})")
                  else:
                      print(f"OK   {name}: {url}")
              except Exception as e:
                  failures.append((name, url, str(e)))
                  print(f"FAIL {name}: {url} ({e})")

          if failures:
              body_lines = ["The weekly API endpoint health check found unreachable endpoints in `data_catalog.yml`:\n"]
              for name, url, reason in failures:
                  body_lines.append(f"- **{name}**: `{url}` — {reason}")
              body_lines.append("\nUpdate or remove the affected entry in `data_catalog.yml`.")
              body = "\n".join(body_lines)

              with open("issue_body.txt", "w") as f:
                  f.write(body)
              with open("has_failures.txt", "w") as f:
                  f.write("true")
              print(f"\n{len(failures)} endpoint(s) failed.")
              sys.exit(0)  # Don't fail the job — we open an issue instead
          else:
              with open("has_failures.txt", "w") as f:
                  f.write("false")
              print("\nAll endpoints healthy.")
          SCRIPT

      - name: Open issue for dead endpoints
        if: hashFiles('issue_body.txt') != ''
        run: |
          if [ "$(cat has_failures.txt)" = "true" ]; then
            EXISTING=$(gh issue list --label "url-health" --state open --json number --jq '.[0].number // empty')
            if [ -n "$EXISTING" ]; then
              gh issue comment "$EXISTING" --body "$(cat issue_body.txt)"
              echo "Updated existing issue #$EXISTING"
            else
              gh issue create \
                --title "Dead API endpoints in data_catalog.yml" \
                --body "$(cat issue_body.txt)" \
                --label "url-health"
              echo "Created new issue"
            fi
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
