name: Tests

on:
  push:
  pull_request:

jobs:

  # ── Core tests — blocks the push on failure ────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Smoke test — library imports, schema, and pure-code stages
        run: pytest tests/test_import.py -v

  # ── API endpoint health — never blocks the push ────────────────────────
  url-health:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml requests pytest

      - name: Check external validation API endpoints
        run: pytest tests/test_url_health.py -v -s
